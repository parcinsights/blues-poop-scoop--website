                  description: 'Zip code. Must be a 5-digit number.'
                  example: '12110'
                number_of_dogs:
                  type: integer
                  description: 'Number of dogs.'
                  example: 2
                last_time_yard_was_thoroughly_cleaned:
                  type: string
                  description: 'When the yard was last thoroughly cleaned. Available options are: one_week, two_weeks, three_weeks, one_month, two_months, 3-4_months, 5-6_months, 7-9_months, 10+_months.'
                  example: one_week
                clean_up_frequency:
                  type: string
                  description: 'Cleanup frequency. Available options are: seven_times_a_week, six_times_a_week, five_times_a_week, four_times_a_week, three_times_a_week, two_times_a_week, once_a_week, bi_weekly, twice_per_month, every_three_weeks, every_four_weeks, once_a_month, one_time.'
                  example: once_a_week
                first_name:
                  type: string
                  description: 'Client first name.'
                  example: John
                last_name:
                  type: string
                  description: 'Client last name.'
                  example: Doe
                email:
                  type: email
                  description: 'Client email.'
                  example: mail@email.com
                city:
                  type: string
                  description: 'Client city.'
                  example: Latham
                home_address:
                  type: string
                  description: 'Client street address.'
                  example: '1494 Ben Street'
                state:
                  type: string
                  description: 'Client state (two-letter abbreviation).'
                  example: TX
                home_phone_number:
                  type: string
                  description: 'Client home phone number.'
                  example: '4155550110'
                  nullable: true
                cell_phone_number:
                  type: string
                  description: 'Client cell phone number.'
                  example: '2025550101'
                  nullable: true
                initial_cleanup_required:
                  type: integer
                  description: 'Whether the client requested an initial cleanup. Available options: 0 (no), 1 (yes).'
                  example: 1
                cleanup_notification_type:
                  type: string
                  description: 'Cleanup notification types. Available options: off_schedule, on_the_way and completed.'
                  example: 'on_the_way,completed'
                  nullable: true
                cleanup_notification_channel:
                  type: string
                  description: 'Method used to notify your client. Available options: sms, email or call.'
                  example: sms
                  nullable: true
                how_heard_about_us:
                  type: string
                  description: 'How the client heard about you. Available options: search_engine, previous_client, referred_by_family_or_friend, flier_from_business, directory_listing, social_media, vehicle_signage, radio_ad, local_event, gift_certificate, other.'
                  example: social_media
                  nullable: true
                how_heard_answer:
                  type: string
                  description: 'Details for "how_heard_about_us".'
                  example: Facebook
                  nullable: true
                additional_comment:
                  type: string
                  description: 'Additional client comment.'
                  example: 'Please clean my yard.'
                  nullable: true
                credit_card_token:
                  type: string
                  description: 'Card token from CardConnect or Stripe (credit card on file).'
                  example: 'tok_5678967890678 or 678987678909876'
                  nullable: true
                name_on_card:
                  type: string
                  description: 'Name on card.'
                  example: 'John Doe'
                postal:
                  type: string
                  description: 'Billing postal code (required for CardConnect tokens).'
                  example: '28301'
                  nullable: true
                expiry:
                  type: string
                  description: 'Expiration (required for CardConnect tokens).'
                  example: '0924'
                  nullable: true
                dog_name:
                  type: array
                  description: 'List of dog names (index-aligned with other dog_* arrays).'
                  example:
                    - expedita
                  items:
                    type: string
                    nullable: true
                safe_dog:
                  type: array
                  description: 'Whether each dog is safe for the technician (index-aligned).'
                  example:
                    - alias
                  items:
                    type: string
                    nullable: true
