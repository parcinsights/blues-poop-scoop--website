  /api/v2/check_zip_code_multi_organizations:
    get:
      summary: 'Find the nearest eligible organization for a ZIP code'
      operationId: findTheNearestEligibleOrganizationForAZIPCode
      description: "Returns the registration URL and the selected organization slug based on the provided ZIP code and a list of organization slugs.\nIf the ZIP code is not in any service area, the nearest organization is returned and `out_of_area` will be 1."
      parameters:
        -
          in: query
          name: zip_code
          description: 'Client ZIP code. Must be a 5-digit number.'
          example: '12345'
          required: true
          schema:
            type: string
            description: 'Client ZIP code. Must be a 5-digit number.'
            example: '12345'
        -
          in: query
          name: slugs
          description: 'List of organization slugs to check.'
          example:
            - nostrum
          required: true
          schema:
            type: array
            description: 'List of organization slugs to check.'
            example:
              - nostrum
            items:
              type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  url: 'https://google.com'
                  slug: ena-adamz-midmc
                  out_of_area: 1
                properties:
                  url:
                    type: string
                    example: 'https://google.com'
                  slug:
                    type: string
                    example: ena-adamz-midmc
                  out_of_area:
                    type: integer
                    example: 1
      tags:
        - 'Multi organization zip code check'
